name: Update README Card

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "readme_config.json"
      - "scripts/generate_readme.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"

permissions:
  contents: write

concurrency:
  group: update-byteclaw-readme
  cancel-in-progress: true

jobs:
  update-readme-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate aligned README card
        run: python scripts/generate_readme.py

      - name: Commit updated README assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/byteclaw-readme.svg readme_config.json scripts/generate_readme.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update aligned ByteClaw README card"
            git push
          fi
